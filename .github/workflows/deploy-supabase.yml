name: Deploy Supabase

# Applies supabase/reset.sql (schema only — no cron jobs, no Vault) to the
# production database. Runs after the CI workflow succeeds on main, or manually
# via workflow_dispatch. Needs the SUPABASE_DB_URL repository secret (Session
# Pooler URI — GitHub runners are IPv4-only); setup in DEPLOYMENT.md.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply schema
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard destructive SQL
        run: npm run check:destructive-sql

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply schema
        run: npm run db:apply
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
